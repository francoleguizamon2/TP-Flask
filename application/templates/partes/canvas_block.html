<div class="row">

  <div class="col-12 mb-3">
    <h6 class="fw-semibold mb-2">Top 10 universidades más económicas</h6>
    <canvas class="grafico w-100" height="230"
            data-chart="top_univ"
            data-tipo="{{ tipo_cortina }}"
            data-valor="{{ valor_cortina }}"></canvas>
  </div>

  <div class="col-sm-6 mb-3">
    <h6 class="fw-semibold mb-2">Distribución promedio de componentes</h6>
    <canvas class="grafico w-100" height="230"
            data-chart="dist_comp"
            data-tipo="{{ tipo_cortina }}"
            data-valor="{{ valor_cortina }}"></canvas>
  </div>

  <div class="col-sm-6 mb-3">
    <h6 class="fw-semibold mb-2">Costo mensual por universidad</h6>
    <canvas class="grafico w-100" height="230"
            data-chart="mensual"
            data-tipo="{{ tipo_cortina }}"
            data-valor="{{ valor_cortina }}"></canvas>
  </div>

  <div class="col-12 mb-3">
    <h6 class="fw-semibold mb-2">Composición del costo total</h6>
    <canvas class="grafico w-100" height="1200"
            data-chart="stacked"
            data-tipo="{{ tipo_cortina }}"
            data-valor="{{ valor_cortina }}"></canvas>
  </div>

  <div class="col-sm-6 mb-3">
    <h6 class="fw-semibold mb-2">Top 10 programas más económicos</h6>
    <canvas class="grafico w-100" height="230"
            data-chart="top_eco_prog"
            data-tipo="{{ tipo_cortina }}"
            data-valor="{{ valor_cortina }}"></canvas>
  </div>

  <div class="col-sm-6 mb-3">
    <h6 class="fw-semibold mb-2">Top 10 programas más largos</h6>
    <canvas class="grafico w-100" height="230"
            data-chart="top_largos_prog"
            data-tipo="{{ tipo_cortina }}"
            data-valor="{{ valor_cortina }}"></canvas>
  </div>

  <div class="col-sm-6 mb-3">
    <h6 class="fw-semibold mb-2">Top 10 países más económicos</h6>
    <canvas class="grafico w-100" height="230"
            data-chart="top_eco_pais"
            data-tipo="{{ tipo_cortina }}"
            data-valor="{{ valor_cortina }}"></canvas>
  </div>

  <div class="col-sm-6 mb-3">
    <h6 class="fw-semibold mb-2">Países con menor duración promedio</h6>
    <canvas class="grafico w-100" height="230"
            data-chart="duracion_corta_pais"
            data-tipo="{{ tipo_cortina }}"
            data-valor="{{ valor_cortina }}"></canvas>
  </div>

</div>
